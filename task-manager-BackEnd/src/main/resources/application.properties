spring.application.name=task-manager-BackEnd

# CONFIGURATION GROQ (SPRING AI)
# ----------------------------------------------------
# Endpoint local d'Ollama (aucun apikey requis)
#spring.ai.ollama.base-url=http://localhost:11434
