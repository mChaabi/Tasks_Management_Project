<nav class="navbar" *ngIf="isLoggedIn()">
  <div class="navbar-container">
    
    <!-- Brand / Logo -->
    <div class="brand" routerLink="/projects">
      <div class="brand-logo">⚡</div>
      <span class="brand-name">TaskManager</span>
    </div>

    <!-- Links de Navegación -->
    <ul class="nav-links">
      <li>
        <a routerLink="/projects" routerLinkActive="active" class="nav-item">
          <span class="icon">📁</span>
          <span>Proyectos</span>
        </a>
      </li>
      <li>
        <a routerLink="/tasks" routerLinkActive="active" class="nav-item">
          <span class="icon">✅</span>
          <span>Tareas</span>
        </a>
      </li>

      <!-- Menú Opciones / Herramientas -->
      <li class="tools-dropdown">
        <button class="tools-btn" (click)="toggleToolsMenu()" type="button" [class.active]="showToolsMenu">
          <span class="icon">🧰</span>
          <span>Herramientas</span>
          <span class="badge" *ngIf="notificationService.urgentCount() > 0">
            {{ notificationService.urgentCount() }}
          </span>
          <span class="chevron">▾</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" *ngIf="showToolsMenu">
          <button class="dropdown-item" (click)="goToCalendar()">
            <span class="icon">📅</span> Calendario
          </button>
          <button class="dropdown-item" (click)="openNotifications()">
            <span class="icon">🔔</span> Notificaciones
            <span class="mini-badge" *ngIf="notificationService.urgentCount() > 0">
              {{ notificationService.urgentCount() }}
            </span>
          </button>
        </div>
      </li>
    </ul>

    <!-- Acciones Usuario -->
    <div class="user-actions">
      <button class="btn-logout" (click)="logout()">
        <span class="icon">🚪</span>
        <span>Cerrar sesión</span>
      </button>
    </div>

  </div>

  <!-- Panel flotante de Notificaciones -->
  <div class="notif-panel-wrapper" *ngIf="showNotifPanel">
    <div class="notif-panel">
      <div class="notif-header">
        <h3>Tareas urgentes</h3>
        <button class="close-btn" (click)="closeNotifPanel()">✕</button>
      </div>

      <div *ngIf="notificationService.urgentTasks().length === 0" class="notif-empty">
        No tienes tareas urgentes 🎉
      </div>

      <ul class="notif-list">
        <li *ngFor="let task of notificationService.urgentTasks()"
            (click)="goToTaskProject(task.projectId)"
            [class.overdue]="notificationService.isOverdue(task)">
          <span class="notif-icon">{{ notificationService.isOverdue(task) ? '⏰' : '⚠️' }}</span>
          <div class="notif-content">
            <strong>{{ task.title }}</strong>
            <span class="due-date">
              {{ notificationService.isOverdue(task) ? 'Vencida' : 'Vence' }}: {{ task.dueDate | date: 'dd/MM/yyyy' }}
            </span>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
