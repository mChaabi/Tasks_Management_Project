<div class="projects-container">
  <div class="header">
    <div>
      <h1>Gestión de Proyectos</h1>
      <p>Lista general de proyectos y sus acciones</p>
    </div>
    <button class="btn-primary" (click)="openModal()">+ Nuevo Proyecto</button>
  </div>

  <div *ngIf="isLoading" class="loader-container">
    <div class="spinner"></div>
  </div>

  <!-- Le tableau s'affiche uniquement si showTable est vrai -->
  <div *ngIf="!isLoading && showTable" class="table-wrapper">
    <div *ngIf="projects.length === 0" class="empty-state">
      <p>No hay proyectos registrados. ¡Crea el primero!</p>
    </div>

    <table *ngIf="projects.length > 0" class="projects-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let project of projects">
          <td>#{{ project.id }}</td>
          <td class="font-bold">{{ project.title }}</td>
          <td class="desc-cell">{{ project.description }}</td>
          <td>
            <span class="status-badge" [ngClass]="(project.status || 'PLANNED').toLowerCase()">
              {{ project.status || 'PLANNED' }}
            </span>
          </td>
          <td class="actions-cell">
            <a [routerLink]="['/projects', project.id]" class="btn-action view">
              👁️ Ver / Tasks
            </a>
            <button class="btn-action delete" (click)="deleteProject(project.id!, $event)">
              🗑️ Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal en superposition (Overlay) -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <h2>Crear Nuevo Proyecto</h2>
      <form [formGroup]="projectForm" (ngSubmit)="createProject()">
        <div class="form-group">
          <label>Título</label>
          <input type="text" formControlName="title" placeholder="Nombre del proyecto" />
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea formControlName="description" rows="3" placeholder="Detalles del proyecto"></textarea>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select formControlName="status">
            <option value="PLANNED">Planificado</option>
            <option value="IN_PROGRESS">En Progreso</option>
            <option value="COMPLETED">Completado</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="projectForm.invalid">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
