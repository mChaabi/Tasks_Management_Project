<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Connexion</h2>
      <p>Bienvenue ! Veuillez vous connecter à votre compte.</p>
    </div>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="nom@exemple.com"
          [class.invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <small class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
          L'email est requis.
        </small>
        <small class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
          Veuillez saisir un email valide.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <small class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
          Le mot de passe est requis.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Vous n'avez pas de compte ? <a routerLink="/auth/register">S'inscrire</a></p>
    </div>
  </div>
</div>
