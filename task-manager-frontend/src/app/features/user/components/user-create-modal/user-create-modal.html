<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Ajouter un nouveau membre</h3>
      <button type="button" class="btn-close" (click)="close.emit()" aria-label="Fermer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" #userForm="ngForm">
      <div class="modal-body">
        
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="newUser.name" 
            name="name" 
            required 
            placeholder="Ex: Jean Dupont" 
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="newUser.email" 
            name="email" 
            required 
            placeholder="jean@test.com" 
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="newUser.password" 
            name="password" 
            required 
            placeholder="••••••••" 
          />
        </div>

        <div class="form-group">
          <label for="role">Rôle</label>
          <select id="role" [(ngModel)]="newUser.role" name="role" required>
            <option [ngValue]="Role.DEVELOPER">Développeur</option>
            <option [ngValue]="Role.MANAGER">Manager</option>
            <option [ngValue]="Role.ADMIN">Admin</option>
          </select>
        </div>

        <div *ngIf="errorMessage" class="error-banner">
          {{ errorMessage }}
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close.emit()">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="!userForm.form.valid || submitting">
          {{ submitting ? 'Création...' : 'Créer le membre' }}
        </button>
      </div>
    </form>

  </div>
</div>
